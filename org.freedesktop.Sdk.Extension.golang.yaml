id: org.freedesktop.Sdk.Extension.golang
branch: '25.08'
runtime: org.freedesktop.Sdk
build-extension: true
sdk: org.freedesktop.Sdk
runtime-version: '25.08'
separate-locales: false
modules:
  - name: golang
    buildsystem: simple
    sources:
      - type: archive
        only-arches:
          - aarch64
        url: https://go.dev/dl/go1.26.5.linux-arm64.tar.gz
        sha256: fe4789e92b1f33358680864bbe8704289e7bb5fc207d80623c308935bd696d49
        x-checker-data:
          type: anitya
          project-id: 1227
          stable-only: true
          url-template: https://go.dev/dl/go$version.linux-arm64.tar.gz
      - type: archive
        only-arches:
          - x86_64
        url: https://go.dev/dl/go1.26.5.linux-amd64.tar.gz
        sha256: 5c2c3b16caefa1d968a94c1daca04a7ca301a496d9b086e17ad77bb81393f053
        x-checker-data:
          type: anitya
          project-id: 1227
          stable-only: true
          url-template: https://go.dev/dl/go$version.linux-amd64.tar.gz
    build-commands:
      - install -d /usr/lib/sdk/golang
      - cp -rpv * /usr/lib/sdk/golang/

  - name: scripts
    sources:
      - type: script
        commands:
          - export GOROOT=/usr/lib/sdk/golang
          - export PATH=$PATH:$GOROOT/bin
        dest-filename: enable.sh
    buildsystem: simple
    build-commands:
      - cp enable.sh /usr/lib/sdk/golang/

  - name: appdata
    buildsystem: simple
    build-commands:
      - install -Dm0644 org.freedesktop.Sdk.Extension.golang.appdata.xml -t ${FLATPAK_DEST}/share/metainfo
    sources:
      - type: file
        path: org.freedesktop.Sdk.Extension.golang.appdata.xml
